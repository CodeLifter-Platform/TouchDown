name: Tests

# PR gate: build and test the solution on a linux runner. No publishing, no releases —
# those live in build.yml behind workflow_dispatch.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]       # post-merge sanity check on the same cheap path

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest  # linux minutes are the cheapest tier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The git-backed tests shell out to `git commit`, which needs an identity.
      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@touchdown.local"
          git config --global user.name "TouchDown CI"

      - run: dotnet build TouchDown.sln -c Release
      - run: dotnet test TouchDown.sln -c Release --no-build --verbosity normal
